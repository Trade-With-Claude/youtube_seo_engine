<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}YouTube SEO Engine{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <nav class="border-b border-gray-800 px-6 py-4">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-purple-400">YT SEO Engine</a>
            <div class="flex gap-4 text-sm">
                <a href="/" class="text-gray-400 hover:text-white transition">Dashboard</a>
                <a href="/trends" class="text-gray-400 hover:text-white transition">Trends</a>
                <a href="/competitors" class="text-gray-400 hover:text-white transition">Competitors</a>
                <a href="/metadata" class="text-gray-400 hover:text-white transition">Metadata</a>
                <a href="/vph" class="text-gray-400 hover:text-white transition">VPH</a>
                <a href="/seo" class="text-gray-400 hover:text-white transition">SEO Score</a>
                <a href="/report" class="text-gray-400 hover:text-white transition">Report</a>
                <a href="/setup" class="text-gray-400 hover:text-white transition">Setup Guide</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <script>
    // Loading state: when a form submits, disable button and show "Working..."
    document.querySelectorAll('form').forEach(form => {
        form.addEventListener('submit', () => {
            const btn = form.querySelector('button[type="submit"]');
            if (btn && !btn.dataset.noloading) {
                btn.disabled = true;
                btn.dataset.original = btn.textContent;
                btn.textContent = 'Working...';
                btn.classList.add('opacity-50', 'cursor-wait');
            }
        });
    });
    </script>
</body>
</html>
