<form method="post" action="/channel" class="flex gap-3">
    <input
        type="text"
        name="channel_url"
        placeholder="Paste a YouTube channel URL (e.g. https://youtube.com/@handle)"
        class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition"
        required
    >
    <button
        type="submit"
        class="bg-purple-600 hover:bg-purple-500 text-white font-medium px-6 py-3 rounded-lg transition"
    >
        Add Channel
    </button>
</form>
